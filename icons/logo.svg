<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Big sparkle (main) -->
  <g transform="translate(230, 230)" fill="#f59e0b">
    <path d="M 0 -90
             L 22 -22
             L 90 0
             L 22 22
             L 0 90
             L -22 22
             L -90 0
             L -22 -22
             Z"/>
  </g>

  <!-- Small sparkle (top right) -->
  <g transform="translate(360, 150)" fill="#fbbf24">
    <path d="M 0 -45
             L 11 -11
             L 45 0
             L 11 11
             L 0 45
             L -11 11
             L -45 0
             L -11 -11
             Z"/>
  </g>

  <!-- Tiny sparkle (bottom right) -->
  <g transform="translate(360, 340)" fill="#fbbf24">
    <path d="M 0 -30
             L 7 -7
             L 30 0
             L 7 7
             L 0 30
             L -7 7
             L -30 0
             L -7 -7
             Z"/>
  </g>
</svg>
