<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CVQ Hub — Style Test</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="logo-title">
          <img src="icons/icon-192x192.png" alt="" />
          <h1>CVQ Hub</h1>
        </div>
        <div class="header-controls">
          <button class="button">Sign in</button>
          <button class="button primary">Get started</button>
        </div>
      </header>

      <section class="section-card" style="margin-top: 24px">
        <h2>Style test</h2>
        <p>
          If you can see buttons with rounded corners, teal accents, and clean typography — the
          design system is working.
        </p>

        <div class="button-row" style="margin-top: 16px">
          <button class="button primary">Primary</button>
          <button class="button secondary">Secondary</button>
          <button class="button success">Success</button>
          <button class="button warning">Warning</button>
          <button class="button danger">Danger</button>
          <button class="button small">Small</button>
        </div>

        <div class="form-group" style="margin-top: 24px">
          <label for="test">Test input</label>
          <input type="text" id="test" placeholder="Type something…" />
          <small class="help-text">This is help text below a field.</small>
        </div>

        <div class="student-stats" style="margin-top: 24px">
          <span class="stat-badge">12</span>
          <span class="stat-divider">|</span>
          <span class="stat-text">trainees in this class</span>
        </div>

        <div style="margin-top: 24px; display: flex; gap: 8px; flex-wrap: wrap">
          <span class="badge success">✅ Present</span>
          <span class="badge warning">⏰ Late</span>
          <span class="badge danger">❌ Absent</span>
          <span class="badge info">ℹ️ Info</span>
          <span class="badge neutral">Neutral</span>
          <span class="badge primary">Primary</span>
        </div>
      </section>
    </div>
  </body>
</html>
